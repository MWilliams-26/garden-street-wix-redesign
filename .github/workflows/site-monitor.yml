name: Monitor Cloudflare site

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Install browser
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Check deployed site
        working-directory: site
        env:
          PLAYWRIGHT_BASE_URL: https://garden-street-wix-redesign.pages.dev
        run: npm run test:e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-monitor-failure
          path: |
            site/test-results
            site/playwright-report
          retention-days: 14

      - name: Open or update outage issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Cloudflare site monitor needs attention';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `The automated browser check failed against the live Cloudflare site.\n\n[Open the failed check](${runUrl}) to see the affected page and download screenshots or traces. The monitor will run again automatically in six hours.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, assignees: [owner] });
            }

      - name: Close outage issue after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Cloudflare site monitor needs attention';
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: 'The live site passed all browser checks again. Closing this alert automatically.',
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
